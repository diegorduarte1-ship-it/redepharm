  window.processos = [];

  onSnapshot(query(collection(db, "processos"), orderBy("criadoEm", "desc")), snap => {
    window.processos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (typeof renderTudo === 'function') renderTudo();

  window.salvarProcesso = async function() {
    const id = document.getElementById('proc-id').value;
    const nome = document.getElementById('proc-nome').value.trim();
    const responsavel = document.getElementById('proc-responsavel').value.trim();
    if (!nome) { alert('Preencha o nome do processo.'); return; }
    const dados = {
      nome,
      responsavel,
      urgencia: document.getElementById('proc-urgencia').value,
      status: document.getElementById('proc-status').value,
      solicitadoEm: document.getElementById('proc-solicitado').value,
      envioSempla: document.getElementById('proc-envio').value,
      url: document.getElementById('proc-url').value.trim(),
      observacoes: document.getElementById('proc-obs').value.trim(),
      atualizadoEm: new Date().toISOString()
    };
    try {
      if (id) {
        await updateDoc(doc(db, "processos", id), dados);
      } else {
        dados.criadoEm = new Date().toISOString();
        await addDoc(collection(db, "processos"), dados);
      }
      fecharModal();
    } catch(e) { alert('ERRO: ' + e.message + ' | código: ' + e.code); }
  };

  window.excluirProcesso = async function(id) {
    if (!confirm('Excluir este processo definitivamente?')) return;
    try { await deleteDoc(doc(db, "processos", id)); }
    catch(e) { alert('Erro: ' + e.message); }
  };

  window.moverStatus = async function(id, novoStatus) {
    try { await updateDoc(doc(db, "processos", id), { status: novoStatus, atualizadoEm: new Date().toISOString() }); }
    catch(e) { alert('Erro: ' + e.message); }

  window.importarDadosNotion = async function() {
    if ((window.processos||[]).length > 0) {
      if (!confirm('Já existem ' + window.processos.length + ' processo(s) cadastrado(s). Importar mesmo assim pode duplicar itens. Deseja continuar?')) return;
    } else {
      if (!confirm('Importar os ' + DADOS_IMPORTACAO_NOTION.length + ' processos da planilha do Notion agora?')) return;
    }
    const btn = document.getElementById('btn-importar');
    if (btn) { btn.disabled = true; btn.textContent = 'Importando...'; }
    try {
      for (const item of DADOS_IMPORTACAO_NOTION) {
        await addDoc(collection(db, "processos"), { ...item, criadoEm: new Date().toISOString(), atualizadoEm: new Date().toISOString() });
      }
      alert('Importação concluída: ' + DADOS_IMPORTACAO_NOTION.length + ' processos adicionados.');
      if (btn) btn.remove();
    } catch(e) {
      alert('Erro na importação: ' + e.message);
      if (btn) { btn.disabled = false; btn.textContent = '📥 Importar dados do Notion'; }
    }
  };

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,wght@0,600;0,700;0,900;1,500&display=swap');

  :root {
    --verde: #1a4a3a; --verde-medio: #2d6b52; --verde-claro: #4a9470;

  .badge-cloud { background: rgba(255,255,255,0.12); padding: 5px 12px; border-radius: 20px; font-size: 12px; }
  .header-right { display: flex; gap: 10px; align-items: center; }

  .btn {
    border: none; border-radius: 8px; padding: 9px 16px; font-family: inherit;
    font-size: 13.5px; font-weight: 600; cursor: pointer; transition: 0.15s;
  }
  .btn-primario { background: var(--acento); color: white; }
  .btn-primario:hover { background: #b3752f; }
  .btn-secundario { background: white; border: 1px solid var(--borda); color: var(--texto); }
  .btn-secundario:hover { background: var(--cinza-claro); }
  .btn-perigo { background: var(--vermelho-bg); color: var(--vermelho); }
  .btn-perigo:hover { background: #f9dedb; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  .barra-filtros {

  .form-input, .form-select, .form-textarea {

  }
  .form-textarea { resize: vertical; min-height: 70px; width: 100%; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { outline: 2px solid var(--verde-claro); outline-offset: 1px; }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; padding: 18px 28px 0;
  }
  .stat-card {
    background: white; border: 1px solid var(--borda); border-radius: 12px; padding: 14px 16px;
  }
  .stat-label { font-size: 11.5px; color: var(--cinza); text-transform: uppercase; letter-spacing: 0.03em; }
  .stat-valor { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 700; margin-top: 4px; }

  .kanban {
    display: flex; gap: 16px; padding: 20px 28px 40px; overflow-x: auto; align-items: flex-start;
  }
  .coluna { min-width: 270px; max-width: 270px; flex-shrink: 0; }
  .coluna-header {
    display: flex; justify-content: space-between; align-items: center;

  }
  .coluna-count { background: rgba(255,255,255,0.25); border-radius: 20px; padding: 1px 9px; font-size: 12px; }
  .coluna-corpo {
    background: var(--cinza-claro); border-radius: 0 0 10px 10px; padding: 10px; min-height: 120px;

  }
  .coluna-corpo.drag-over { background: var(--verde-bg); }

  .card {

  @media (max-width: 640px) {

</style>

          <option value="nao_iniciado">Não Iniciado</option>
          <option value="em_andamento">Em Andamento</option>
          <option value="aguardando_terceiros">Aguardando Terceiros</option>
          <option value="em_processo_sempla">Em Processo SEMPLA</option>
          <option value="concluido">Concluído</option>
        </select>
      </div>
      <div class="form-grupo full"><label class="form-label">Link / URL (opcional)</label><input type="text" class="form-input" id="proc-url" placeholder="https://..."></div>
      <div class="form-grupo full"><label class="form-label">Observações</label><textarea class="form-textarea" id="proc-obs"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secundario" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primario" onclick="salvarProcesso()">Salvar</button>
    </div>
  </div>
</div>

<script>
const COLUNAS = [
  { id: 'nao_iniciado', label: 'Não Iniciado', cor: '#6b7c75' },
  { id: 'em_andamento', label: 'Em Andamento', cor: '#2d6b52' },
  { id: 'aguardando_terceiros', label: 'Aguardando Terceiros', cor: '#c8863a' },
  { id: 'em_processo_sempla', label: 'Em Processo SEMPLA', cor: '#3a6ea5' },
  { id: 'concluido', label: 'Concluído', cor: '#1a4a3a' }
];
const STATUS_LABEL = Object.fromEntries(COLUNAS.map(c => [c.id, c.label]));

function formatarData(iso) {
  if (!iso) return '';
  const [ano, mes, dia] = iso.split('-');
  if (!dia) return iso;
  return `${dia}/${mes}/${ano}`;
}

function ehAtrasado(p) {
  if (!p.envioSempla || p.status === 'concluido') return false;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  return new Date(p.envioSempla + 'T00:00:00') < hoje;
}

function aplicarFiltros(lista) {
  const busca = (document.getElementById('filtro-busca').value || '').toLowerCase();
  const resp = document.getElementById('filtro-responsavel').value;
  const urg = document.getElementById('filtro-urgencia').value;
  const soAtrasado = document.getElementById('filtro-atrasado').checked;
  return lista.filter(p => {
    if (busca && !(p.nome||'').toLowerCase().includes(busca)) return false;
    if (resp && p.responsavel !== resp) return false;
    if (urg && p.urgencia !== urg) return false;
    if (soAtrasado && !ehAtrasado(p)) return false;
    return true;
  });
}

function renderTudo() {
  const todos = window.processos || [];

  // popula filtro de responsáveis dinamicamente
  const respSelect = document.getElementById('filtro-responsavel');
  const respAtual = respSelect.value;
  const responsaveis = [...new Set(todos.map(p => p.responsavel).filter(Boolean))].sort();
  respSelect.innerHTML = '<option value="">Todos os responsáveis</option>' + responsaveis.map(r => `<option value="${r}">${r}</option>`).join('');
  respSelect.value = respAtual;
  document.getElementById('lista-responsaveis').innerHTML = responsaveis.map(r => `<option value="${r}">`).join('');

  const lista = aplicarFiltros(todos);
  renderStats(todos);
  renderKanban(lista);
}

function renderStats(todos) {
  const hoje = new Date();
  const urgentes = todos.filter(p => p.urgencia === 'urgente' && p.status !== 'concluido');
  const atrasados = todos.filter(ehAtrasado);
  const concluidosMes = todos.filter(p => p.status === 'concluido' && p.atualizadoEm && new Date(p.atualizadoEm).getMonth() === hoje.getMonth() && new Date(p.atualizadoEm).getFullYear() === hoje.getFullYear());

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total de Processos</div><div class="stat-valor">${todos.length}</div></div>
    <div class="stat-card"><div class="stat-label">Urgentes em Aberto</div><div class="stat-valor" style="color:${urgentes.length ? 'var(--acento)' : 'var(--verde)'}">${urgentes.length}</div></div>
    <div class="stat-card"><div class="stat-label">Atrasados</div><div class="stat-valor" style="color:${atrasados.length ? 'var(--vermelho)' : 'var(--verde)'}">${atrasados.length}</div></div>
    <div class="stat-card"><div class="stat-label">Concluídos este mês</div><div class="stat-valor" style="color:var(--verde)">${concluidosMes.length}</div></div>
  `;
}

function renderKanban(lista) {
  const kanban = document.getElementById('kanban');
  kanban.innerHTML = COLUNAS.map(col => {
    const itens = lista.filter(p => p.status === col.id)
      .sort((a,b) => (b.urgencia === 'urgente') - (a.urgencia === 'urgente'));
    return `
      <div class="coluna">
        <div class="coluna-header" style="background:${col.cor}">
          <span>${col.label}</span>
          <span class="coluna-count">${itens.length}</span>
        </div>
        <div class="coluna-corpo" ondragover="event.preventDefault(); this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="onDrop(event, '${col.id}')">
          ${itens.length === 0 ? '<div class="vazio-coluna">Nenhum processo aqui</div>' : itens.map(cardHTML).join('')}
        </div>
      </div>`;
  }).join('');
}

function cardHTML(p) {
  const atrasado = ehAtrasado(p);
  const classes = ['card', p.urgencia === 'urgente' ? 'urgente' : '', atrasado ? 'atrasado' : ''].filter(Boolean).join(' ');
  return `<div class="${classes}" draggable="true" ondragstart="onDragStart(event,'${p.id}')" onclick="abrirModal('${p.id}')">
    <div class="card-titulo">${p.nome}</div>
    <div class="card-meta">
      ${p.responsavel ? '<span>👤 ' + p.responsavel + '</span>' : ''}
      ${p.envioSempla ? '<span>📅 Envio SEMPLA: ' + formatarData(p.envioSempla) + '</span>' : ''}
      ${p.url ? '<span>🔗 <a href="' + p.url + '" target="_blank" onclick="event.stopPropagation()">Link do processo</a></span>' : ''}
    </div>
    ${p.urgencia === 'urgente' ? '<span class="tag tag-urgente">🔶 Urgente</span>' : ''}
    ${atrasado ? '<span class="tag tag-atrasado">⚠ Atrasado</span>' : ''}
    <div class="card-acoes" onclick="event.stopPropagation()">
      <select class="card-select" onchange="moverStatus('${p.id}', this.value)">
        ${COLUNAS.map(c => `<option value="${c.id}" ${c.id === p.status ? 'selected' : ''}>${c.label}</option>`).join('')}
      </select>
      <button class="btn btn-perigo btn-sm" onclick="excluirProcesso('${p.id}')">✕</button>
    </div>
  </div>`;
}

function onDragStart(ev, id) { ev.dataTransfer.setData('text/plain', id); }
function onDrop(ev, novoStatus) {
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag-over');
  const id = ev.dataTransfer.getData('text/plain');
  if (id) moverStatus(id, novoStatus);
}

function abrirModal(id) {
  const p = id ? (window.processos||[]).find(x => x.id === id) : null;
  document.getElementById('modal-titulo-texto').textContent = p ? 'Editar Processo' : 'Novo Processo';
  document.getElementById('proc-id').value = p ? p.id : '';
  document.getElementById('proc-nome').value = p ? p.nome : '';
  document.getElementById('proc-responsavel').value = p ? (p.responsavel||'') : '';
  document.getElementById('proc-urgencia').value = p ? (p.urgencia||'normal') : 'normal';
  document.getElementById('proc-status').value = p ? p.status : 'nao_iniciado';
  document.getElementById('proc-solicitado').value = p ? (p.solicitadoEm||'') : '';
  document.getElementById('proc-envio').value = p ? (p.envioSempla||'') : '';
  document.getElementById('proc-url').value = p ? (p.url||'') : '';
  document.getElementById('proc-obs').value = p ? (p.observacoes||'') : '';
  document.getElementById('modal-processo').classList.add('aberto');
}

function fecharModal() { document.getElementById('modal-processo').classList.remove('aberto'); }

renderTudo();
</script>
</body>
</html>
